<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReDefiNER demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f8fafc; font-family: Inter, system-ui, sans-serif; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: #475569; font-size: 15px; background: #f8fafc; transition: opacity .3s;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading strong { color: #0f172a; font-size: 22px; letter-spacing: -.02em; }
    #loading a, #open a { color: #2563eb; text-decoration: none; }
    #open {
      position: fixed; right: 16px; top: 12px; font-size: 12px; padding: 4px 10px; border-radius: 999px;
      background: rgba(255, 255, 255, .9); border: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <iframe id="app" src="https://redefiner-demo.centralindia.cloudapp.azure.com/?__theme=light" title="ReDefiNER demo"
          allow="clipboard-write"></iframe>
  <div id="loading">
    <strong>ReDefiNER</strong>
    <span>Loading the demo…</span>
    <span>If it doesn't appear, <a href="https://redefiner-demo.centralindia.cloudapp.azure.com/?__theme=light" target="_blank"
          rel="noopener">open it in a new tab</a>.</span>
  </div>
  <div id="open"><a href="https://redefiner-demo.centralindia.cloudapp.azure.com/?__theme=light" target="_blank"
       rel="noopener">Open in a new tab ↗</a></div>
  <script>
    document.getElementById("app").addEventListener("load", () => {
      document.getElementById("loading").classList.add("done");
    });
  </script>
</body>
</html>
